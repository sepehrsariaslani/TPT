<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TPT — Material in Motion</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <canvas id="scene"></canvas>

    <header class="nav">
      <div class="brand">TPT</div>
      <div class="nav-right">
        <span>material</span>
        <span>process</span>
        <span>products</span>
      </div>
    </header>

    <div class="hud">
      <div class="hud-dot"></div>
      <span id="phaseLabel">FORM</span>
    </div>

    <main>
      <section class="panel hero">
        <div class="copy">
          <div class="eyebrow">PRECISION PLASTICS</div>
          <h1>RAW<br/>MATERIAL<br/>IN MOTION</h1>
          <p>Scroll to transform the final molded part back into flowing plastic granules.</p>
        </div>
        <div class="scroll-cue">SCROLL ↓</div>
      </section>

      <section class="panel spacer"></section>
      <section class="panel spacer"></section>
      <section class="panel spacer"></section>
      <section class="panel end-panel">
        <div class="end-copy">
          <div class="eyebrow">POLYMER GRANULES</div>
          <h2>EVERY PRODUCT<br/>STARTS HERE.</h2>
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
